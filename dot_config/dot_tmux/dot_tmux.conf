# =============================================================================
# TMUX Configuration - Optimized for Development
# =============================================================================

# --- Core Settings ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on

# --- Key Bindings ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Window management
bind c new-window -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind w list-windows
bind x kill-pane
bind X kill-window

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-j select-window -t :
bind Tab last-window

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Toggle pane zoom
bind z resize-pane -Z

# Break pane into new window
bind b break-pane -t :

# Join pane into window
bind j command-prompt -p "join pane from:" "join-pane -s '%%'"

# Session management
bind s choose-tree -Zs
bind S new-session -s "dev-$(date +%s)"
bind d detach-client

# Copy mode (vi-like)
set -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Search in copy mode
bind -T copy-mode-vi '/' command-prompt -p "(search down)" "send -X search-forward '%%'"
bind -T copy-mode-vi '?' command-prompt -p "(search up)" "send -X search-backward '%%'"

# Paste
bind p paste-buffer
bind P choose-buffer -Z

# --- Status Bar ---
set -g status-position top
set -g status-style bg=#1e1e2e,fg=#cdd6f4
set -g status-left-length 50
set -g status-right-length 50

# Left: Session name
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #{session_name} #[bg=#1e1e2e,fg=#89b4fa]"

# Right: Time and date
set -g status-right "#[fg=#6c7086]#[fg=#cdd6f4] %H:%M #[fg=#6c7086]|#[fg=#cdd6f4] %a %b %d"

# Window status
set -g window-status-format "#[fg=#6c7086] #{window_index}:#{window_name} "
set -g window-status-current-format "#[bg=#a6e3a1,fg=#1e1e2e,bold] #{window_index}:#{window_name} #[bg=#1e1e2e,fg=#a6e3a1]"
set -g window-status-activity-style "fg=#fab1a0"
set -g window-status-bell-style "fg=#f38ba8"

# --- Pane Borders ---
set -g pane-border-style fg=#45475a
set -g pane-active-border-style fg=#89b4fa
set -g pane-border-lines heavy

# --- Message Styling ---
set -g message-style bg=#313244,fg=#cdd6f4
set -g message-command-style bg=#313244,fg=#cdd6f4

# --- Clock ---
set -g clock-mode-colour "#89b4fa"

# --- Display ---
set -g display-panes-colour "#6c7086"

# --- Neovim Integration ---
# Allow neovim to use undercurl and true colors
set -s escape-time 0

# Detect shell (works on Linux, WSL, macOS)
if-shell "test -x /bin/zsh" "set -g default-shell /bin/zsh"
if-shell "test -x /usr/bin/zsh" "set -g default-shell /usr/bin/zsh"
if-shell "test -x /opt/homebrew/bin/zsh" "set -g default-shell /opt/homebrew/bin/zsh"

# Automatic window rename from command
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Focus events for neovim autoread
set -g focus-events on

# --- Plugins (TPM - Tmux Plugin Manager) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect + Continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
