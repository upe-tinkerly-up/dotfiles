[package]
name = "vault"
version = "1.0.0"
edition = "2021"
description = "Enhanced Obsidian SQLite Vault CLI (Rust rewrite)"
authors = ["upe"]

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
walkdir = "2"